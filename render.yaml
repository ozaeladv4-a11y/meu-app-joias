services:
  - type: web
    name: gestao-joias
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
